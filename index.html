<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMMWE AI Level Gen</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; background: #0d0d0f; color: #f0f0f0; }

#lockScreen {
  position: fixed; inset: 0; background: #0d0d0f;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; z-index: 999;
}
#lockScreen h2 { font-size: 1.5rem; color: #c8ff00; }
#lockScreen p { color: #888; font-size: 0.85rem; }
#lockScreen input {
  padding: 10px 16px; border-radius: 6px; border: 1px solid #444;
  background: #1e1e24; color: #fff; font-size: 1rem; width: 260px; text-align: center;
}
#lockScreen button {
  padding: 10px 32px; background: #c8ff00; color: #000;
  border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer;
}
#lockError { color: #ff4466; font-size: 0.85rem; display: none; }

#app { display: none; }

header {
  background: #16161a; border-bottom: 1px solid #2a2a35;
  padding: 14px 20px; display: flex; align-items: center; gap: 10px;
}
header h1 { font-size: 1.1rem; }
header span { color: #c8ff00; }

main { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 53px); }

.panel {
  background: #16161a; border-right: 1px solid #2a2a35;
  padding: 16px; display: flex; flex-direction: column; gap: 12px;
  overflow-y: auto;
}

label { font-size: 0.78rem; color: #888; display: block; margin-bottom: 3px; }

input[type=text], input[type=number], select, textarea {
  width: 100%; background: #1e1e24; border: 1px solid #2a2a35;
  color: #f0f0f0; border-radius: 5px; padding: 7px 10px;
  font-size: 0.85rem; font-family: sans-serif; outline: none;
}
textarea { resize: vertical; height: 80px; }

.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.btn-gen {
  width: 100%; padding: 11px; background: #c8ff00; color: #000;
  border: none; border-radius: 6px; font-weight: bold; font-size: 0.95rem;
  cursor: pointer; margin-top: 4px;
}
.btn-gen:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-load {
  width: 100%; padding: 9px; background: #1e1e24; color: #f0f0f0;
  border: 1px solid #2a2a35; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
}

.editor-side { display: flex; flex-direction: column; }

.editor-top {
  background: #16161a; border-bottom: 1px solid #2a2a35;
  padding: 10px 16px; display: flex; gap: 8px; align-items: center;
}
.editor-top span { color: #888; font-size: 0.78rem; flex: 1; font-family: monospace; }

.btn-dl {
  padding: 7px 16px; background: #00c8ff; color: #000;
  border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 0.82rem;
}
.btn-copy {
  padding: 7px 14px; background: #1e1e24; color: #f0f0f0;
  border: 1px solid #2a2a35; border-radius: 5px; cursor: pointer; font-size: 0.82rem;
}

#jsonOut {
  flex: 1; background: #0d0d0f; border: none; color: #7affb2;
  font-family: monospace; font-size: 0.78rem; padding: 16px;
  resize: none; outline: none; line-height: 1.6;
}

.statusbar {
  background: #16161a; border-top: 1px solid #2a2a35;
  padding: 5px 16px; font-family: monospace; font-size: 0.7rem; color: #888;
  display: flex; align-items: center; gap: 8px;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: #888; flex-shrink: 0; }
.dot.ok { background: #c8ff00; }
.dot.loading { background: #ff9900; animation: blink 0.7s infinite; }
.dot.error { background: #ff4466; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

#msgBox {
  margin-top: 6px; padding: 10px; background: #1e1e24; border-radius: 5px;
  font-size: 0.8rem; color: #888; font-family: monospace; display: none;
  border: 1px solid #2a2a35;
}

section-title {
  font-size: 0.65rem; color: #888; text-transform: uppercase;
  letter-spacing: 0.1em; font-family: monospace;
}

hr { border: none; border-top: 1px solid #2a2a35; }

input[type=file] { display: none; }
</style>
</head>
<body>

<!-- TELA DE SENHA -->
<div id="lockScreen">
  <div style="font-size:2.5rem">🎮</div>
  <h2>SMMWE AI Level Gen</h2>
  <p>Digite a senha para acessar</p>
  <input type="password" id="senhaInput" placeholder="Senha" onkeydown="if(event.key==='Enter')entrar()">
  <button onclick="entrar()">Entrar</button>
  <p id="lockError">Senha incorreta, tente novamente.</p>
</div>

<!-- APP PRINCIPAL -->
<div id="app">
  <header>
    <span style="font-size:1.4rem">🎮</span>
    <h1>SMMWE <span>AI</span> Level Gen</h1>
  </header>

  <main>
    <div class="panel">
      <div>
        <label>Descreva a fase</label>
        <textarea id="prompt" placeholder="Ex: fase com canos, inimigos voadores, tema castelo..."></textarea>
      </div>

      <hr>

      <div>
        <label>Nome da fase</label>
        <input type="text" id="levelName" value="Minha Fase">
      </div>
      <div class="row2">
        <div>
          <label>Gamestyle</label>
          <select id="gamestyle">
            <option value="1">SMB1</option>
            <option value="2">SMB3</option>
            <option value="3" selected>SMW</option>
            <option value="4">NSMBU</option>
            <option value="5">SM3DW</option>
          </select>
        </div>
        <div>
          <label>Tema</label>
          <select id="gametheme">
            <option value="overworld">Overworld</option>
            <option value="underground">Underground</option>
            <option value="castle">Castle</option>
            <option value="airship">Airship</option>
            <option value="underwater">Underwater</option>
            <option value="ghost_house">Ghost House</option>
            <option value="snow">Snow</option>
            <option value="fall">Fall</option>
            <option value="desert">Desert</option>
            <option value="forest">Forest</option>
            <option value="sky">Sky</option>
          </select>
        </div>
      </div>
      <div class="row2">
        <div><label>Timer (seg)</label><input type="number" id="timer" value="300"></div>
        <div><label>Tamanho</label><input type="number" id="size" value="9216" step="256"></div>
      </div>
      <div class="row2">
        <div><label>Dificuldade</label>
          <select id="diff">
            <option>Muito Fácil</option>
            <option selected>Médio</option>
            <option>Difícil</option>
            <option>Extremo</option>
          </select>
        </div>
        <div><label>Densidade</label>
          <select id="density">
            <option>Esparsa</option>
            <option selected>Média</option>
            <option>Densa</option>
          </select>
        </div>
      </div>

      <button class="btn-gen" id="btnGen" onclick="gerarFase()">✦ Gerar Fase com IA</button>

      <div id="msgBox"></div>

      <hr>

      <input type="file" id="fileIn" accept=".swe" onchange="loadSWE(event)">
      <button class="btn-load" onclick="document.getElementById('fileIn').click()">📂 Abrir arquivo .swe</button>
    </div>

    <div class="editor-side">
      <div class="editor-top">
        <span>JSON da fase — editável</span>
        <button class="btn-copy" onclick="copiar()">Copiar</button>
        <button class="btn-dl" onclick="baixar()">⬇ Baixar .swe</button>
      </div>
      <textarea id="jsonOut" spellcheck="false"></textarea>
      <div class="statusbar">
        <div class="dot ok" id="dot"></div>
        <span id="statusMsg">pronto</span>
      </div>
    </div>
  </main>
</div>

<script>
const WORKER = "https://silent-frog-bb89.hugo-augusto2024.workers.dev/";
const KEY_SWE = "2559F35097-2021";

const defaultJSON = {
  "S0":{
    "S8":[],"S6":[],"S2":[],"S4":[],"S3":[],"S7":[],
    "S1":[{"goal_y":400,"nightmode":0,"label_1":0,"autoscroll":0,"t_conditions":0,
      "wl":416,"mtrs":0,"wl_speed":0.2,"c_conditions":0,"conditions":0,
      "t":1,"start_y":400,"date":"31/03/2026","goal_x":9056,"size":9216,
      "gamestyle":3,"ds_s":0,"desc":"level","label_2":7,"user":"user",
      "time":"14:00","gametheme":"fall","wl_limit":416,"o_conditions":0,"timer":300}],
    "S5":[]
  },
  "SB1":{"S1":[]}
};

document.getElementById('jsonOut').value = JSON.stringify(defaultJSON, null, 2);

function setStatus(state, msg) {
  document.getElementById('dot').className = 'dot ' + state;
  document.getElementById('statusMsg').textContent = msg;
}

function showMsg(msg) {
  const b = document.getElementById('msgBox');
  b.textContent = msg;
  b.style.display = 'block';
}

// SENHA
function entrar() {
  const senha = document.getElementById('senhaInput').value.trim();
  if (!senha) return;
  
  if (senha === "dumer123") {
    sessionStorage.setItem('senha', senha);
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  } else {
    document.getElementById('lockError').style.display = 'block';
  }
}

if (sessionStorage.getItem('senha')) {
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

// GERAR FASE
async function gerarFase() {
  const btn = document.getElementById('btnGen');
  btn.disabled = true;
  btn.textContent = '⏳ Gerando...';
  setStatus('loading', 'gerando fase com IA...');
  showMsg('🤖 Aguarde, a IA está criando a fase...');

  const sistema = `Você é um gerador de fases para SMMWE. Retorne APENAS JSON puro sem markdown.
Estrutura obrigatória:
{"S0":{"S8":[],"S6":[],"S2":[[x,y,1,largura,1]],"S4":[[x,y,5,1,1,1]],"S3":[[x,y,1]],"S7":[],"S1":[{metadata}],"S5":[]},"SB1":{"S1":[]}}
S2=tiles sólidos, S4=blocos, S3=inimigos, S5=objetos especiais.
Tiles: [x,y,tipo,w,h]. Inimigos: [x,y,tipo]. Chão y=416. Tiles de 32px.
Inimigos: 1=Goomba, 2=Koopa, 3=PiranhaPlant, 7=HammerBros, 8=Boo.
S1[0] deve ter: goal_y,nightmode,label_1,autoscroll,t_conditions,wl,mtrs,wl_speed,c_conditions,conditions,t,start_y,date,goal_x,size,gamestyle,ds_s,desc,label_2,user,time,gametheme,wl_limit,o_conditions,timer.
Gere fase jogável com chão, plataformas, inimigos e goal.`;

  const msg = `Gere fase: nome="${document.getElementById('levelName').value}", gamestyle=${document.getElementById('gamestyle').value}, tema=${document.getElementById('gametheme').value}, timer=${document.getElementById('timer').value}, size=${document.getElementById('size').value}, dificuldade=${document.getElementById('diff').value}, densidade=${document.getElementById('density').value}. Descrição: ${document.getElementById('prompt').value || 'fase divertida'}. goal_x deve ser próximo de ${parseInt(document.getElementById('size').value)-160}.`;

  try {
    const res = await fetch(WORKER, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Password": sessionStorage.getItem('senha') || ''
      },
      body: JSON.stringify({ system: sistema, messages: [{ role: "user", content: msg }] })
    });

    const txt = await res.text();
    if (!txt) throw new Error("Resposta vazia do servidor");

    let data;
    try { data = JSON.parse(txt); } catch(e) { throw new Error("Resposta inválida: " + txt.slice(0,100)); }

    if (data.error) throw new Error(data.error);

    const aiText = data?.content?.[0]?.text || "";
    if (!aiText) throw new Error("IA não retornou texto");

    const cleaned = aiText.replace(/```json\s*/gi,'').replace(/```/g,'').trim();
    const match = cleaned.match(/\{[\s\S]*\}/);
    if (!match) throw new Error("IA não gerou JSON válido. Tente novamente.");

    const parsed = JSON.parse(match[0]);
    if (!parsed.S0 || !parsed.S0.S1) throw new Error("Estrutura inválida. Tente novamente.");

    document.getElementById('jsonOut').value = JSON.stringify(parsed, null, 2);
    setStatus('ok', 'fase gerada!');
    showMsg('✅ Fase gerada! Edite o JSON se quiser, depois clique em Baixar .swe');
  } catch(e) {
    setStatus('error', 'erro');
    showMsg('❌ ' + e.message);
  }

  btn.disabled = false;
  btn.textContent = '✦ Gerar Fase com IA';
}

// SWE
function utf8b64(str) {
  const b = new TextEncoder().encode(str);
  let s = '';
  for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
  return btoa(s);
}
function b64utf8(str) {
  const c = str.replace(/[^A-Za-z0-9+/=]/g,'');
  const b = atob(c);
  const u = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
  return new TextDecoder().decode(u);
}

function baixar() {
  try {
    const raw = document.getElementById('jsonOut').value;
    const min = JSON.stringify(JSON.parse(raw));
    const b64 = utf8b64(min);
    const hmac = CryptoJS.HmacSHA1(b64, KEY_SWE).toString(CryptoJS.enc.Hex);
    const blob = new Blob([b64+hmac], {type:'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (document.getElementById('levelName').value||'level').replace(/\s/g,'_')+'.swe';
    a.click();
    setStatus('ok', 'arquivo baixado!');
  } catch(e) { alert('Erro no JSON: '+e.message); }
}

function copiar() {
  navigator.clipboard.writeText(document.getElementById('jsonOut').value);
  setStatus('ok', 'copiado!');
  setTimeout(()=>setStatus('ok','pronto'),2000);
}

function loadSWE(e) {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = function(ev) {
    try {
      let c = ev.target.result.replace(/[\x00-\x1F\x7F-\x9F]/g,'').trim();
      if (c.length<=40) throw new Error('Arquivo inválido');
      const parsed = JSON.parse(b64utf8(c.slice(0,-40)));
      document.getElementById('jsonOut').value = JSON.stringify(parsed, null, 2);
      setStatus('ok','fase carregada!');
    } catch(err) { alert('Erro: '+err.message); }
  };
  r.readAsText(f);
  e.target.value='';
}
</script>
</body>
</html>
